[project]
name = "project_db"
version = "0.1.0"
description = "Unified project database for multi-source SaaS data."
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
ai = ["anthropic>=0.40"]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
project_db = "project_db.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
